<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실시간 동기화 셔틀버스 탑승 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #f4f6f9; --card: #ffffff; --line: #e5e7eb; --text: #1f2937; --muted: #4b5563;
      --blue: #2563eb; --blueBg: #eff6ff; --green: #16a34a; --greenBg: #f0fdf4; --red: #dc2626; --redBg: #fef2f2;
      font-family: Pretendard, sans-serif; color: var(--text);
    }
    body { margin: 0; background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0; font-size: 16px; font-weight: 800; }
    .main-content { flex: 1; padding: 20px; box-sizing: border-box; }
    .container { max-width: 600px; margin: 0 auto; }
    .dashboard-header { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
    .dashboard-title-area { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .dashboard-title { font-size: 18px; font-weight: 800; margin: 0; }
    .btn-append { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-append:hover { background: #059669; }
    .sub-summary { font-size: 12px; color: var(--muted); }
    .controls { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .search-bar { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 13px; outline: none; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; }
    .tab { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 11px; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .tab.active { background: var(--blue); color: white; border-color: var(--blue); }
    .list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .roster-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); position: relative; }
    .roster-card.disabled-mask::after { content: "처리 중..."; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.6); display:flex; justify-content:center; align-items:center; font-size:12px; font-weight:700; color:var(--blue); border-radius:12px; }
    .roster-card.canceled { background: #f3f4f6; opacity: 0.6; }
    .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .user-name { font-size: 15px; font-weight: 800; }
    .status-badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .status-none { background: #f3f4f6; color: #4b5563; }
    .status-arrived { background: var(--greenBg); color: var(--green); }
    .status-cancel { background: var(--redBg); color: var(--red); }
    .grid-action { display: grid; grid-template-columns: 1fr 1.2fr 1.5fr; gap: 6px; margin-top: 10px; background: #fafafa; padding: 8px; border-radius: 8px; border: 1px solid #f0f0f0; }
    .grid-action label { display: block; font-size: 9px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
    .grid-action input, .grid-action select, .grid-action textarea { width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11px; box-sizing: border-box; outline: none; background: #fff; }
    .phone-link { font-size: 12px; color: var(--blue); text-decoration: none; font-weight: 600; }
    .empty, .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; background: white; border-radius: 12px; border: 1px solid var(--line); }
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; width: 90%; max-width: 450px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; font-weight: 800; color: var(--blue); }
    .paste-area { width: 100%; height: 120px; padding: 12px; border: 2px dashed #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 13px; resize: none; outline: none; background: #f8fafc; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .btn-close { background: #e5e7eb; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-submit { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🚌 셔틀버스 실시간 통합 현장관리</h1>
    <button class="btn-append" style="background:#4b5563;" onclick="fetchRoster()">🔄 새로고침</button>
  </header>

  <div class="main-content">
    <div class="container">
      
      <div class="dashboard-header">
        <div class="dashboard-title-area">
          <h2 class="dashboard-title">상태 모니터링 디렉토리</h2>
          <button class="btn-append" onclick="openAppendModal()">➕ 명단 데이터 주입</button>
        </div>
        <div id="summaryText" class="sub-summary">데이터 불러오는 중...</div>
        
        <div class="controls">
          <input type="search" id="searchKeyword" class="search-bar" placeholder="성명 또는 연락처 실시간 검색..." oninput="renderRoster()" />
          <div class="tabs">
            <div class="tab active" id="tab-all" onclick="filterTab('all')">전체</div>
            <div class="tab" id="tab-arrived" onclick="filterTab('arrived')">도착</div>
            <div class="tab" id="tab-notArrived" onclick="filterTab('notArrived')">미도착</div>
            <div class="tab" id="tab-canceled" onclick="filterTab('canceled')">취소/개별</div>
          </div>
        </div>
      </div>
      
      <div id="loading-msg" class="loading">구글 시트 서버에서 실시간 명단을 받아오고 있습니다...</div>
      <div id="roster-list" class="list" style="display:none;"></div>
      <div id="empty-msg" class="empty" style="display:none;">조건에 맞는 대상자가 없습니다.</div>

    </div>
  </div>

  <div id="appendModal" class="modal-overlay">
    <div class="modal-box">
      <h3>📋 신규 탑승 인원 누적 주입</h3>
      <p style="font-size: 12px; color: var(--muted); margin-top: 0; line-height: 1.4;">
        기존 체크 내역은 보존되며, 새 명단만 아래로 이어 붙습니다. Excel에서 [성명]과 [전화번호] 열을 복사해 붙여넣으세요.
      </p>
      <textarea id="appendPasteInput" class="paste-area" placeholder="홍길동&#9;010-1234-5678"></textarea>
      <div class="modal-footer">
        <button class="btn-close" onclick="closeAppendModal()">닫기</button>
        <button class="btn-submit" onclick="submitAppendRoster()">데이터 서버 전송 🚀</button>
      </div>
    </div>
  </div>

<script>
  // ⚠️ [필수 고쳐야 할 부분] 2단계 결과물인 본인의 구글 웹 앱 주소(https://script.google.com/macros/s/.../exec)를 꼭 넣으세요!
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxEefA8Wg4gnOktMOc9PwyGuI5m-SYGVpqIBeodXSkhFlgDYSEtHTYyrYT7xyMdNe8BvA/exec";

  let ROSTER_DATA = [];
  let CURRENT_TAB = "all";
  let memoTimers = {};

  window.onload = function() {
    fetchRoster();
  }

  // 구글 서버로부터 원격 데이터 수신 (GET)
  function fetchRoster() {
    document.getElementById("loading-msg").style.display = "block";
    document.getElementById("roster-list").style.display = "none";
    
    fetch(`${WEB_APP_URL}?action=getRoster`)
      .then(res => res.json())
      .then(data => {
        ROSTER_DATA = data;
        document.getElementById("loading-msg").style.display = "none";
        document.getElementById("roster-list").style.display = "flex";
        renderRoster();
      })
      .catch(err => {
        document.getElementById("loading-msg").textContent = "서버 연결에 실패했습니다. 구글 웹앱 주소 및 권한 설정을 확인하세요.";
        console.error(err);
      });
  }

  // 서버로 데이터 전달 처리용 헬퍼 함수
  function requestToServer(params, callback) {
    const query = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    fetch(`${WEB_APP_URL}?${query}`, { method: 'POST' })
      .then(res => res.json())
      .then(data => { if(callback) callback(data); })
      .catch(err => alert("네트워크 서버 반영에 실패했습니다. 다시 시도해 주세요."));
  }

  function renderRoster() {
    const keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();
    let rows = ROSTER_DATA.slice();

    const total = ROSTER_DATA.length;
    const arrived = ROSTER_DATA.filter(r => !r.status && r.arrived).length;
    const notArrived = ROSTER_DATA.filter(r => !r.status && !r.arrived).length;
    const canceled = ROSTER_DATA.filter(r => !!r.status).length;
    document.getElementById("summaryText").textContent = `전체 ${total}명 · 도착 ${arrived}명 · 미도착 ${notArrived}명 · 취소/개별 ${canceled}명`;

    if(keyword) {
      rows = rows.filter(r => (r.name + r.phone).toLowerCase().includes(keyword));
    }

    if (CURRENT_TAB === "arrived") rows = rows.filter(r => !r.status && r.arrived);
    else if (CURRENT_TAB === "notArrived") rows = rows.filter(r => !r.status && !r.arrived);
    else if (CURRENT_TAB === "canceled") rows = rows.filter(r => !!r.status);

    rows.sort((a, b) => {
      const getRank = r => !!r.status ? 2 : (r.arrived ? 1 : 0);
      return getRank(a) !== getRank(b) ? getRank(a) - getRank(b) : a.name.localeCompare(b.name, "ko");
    });

    const listEl = document.getElementById("roster-list");
    const emptyEl = document.getElementById("empty-msg");

    if(!rows.length) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    listEl.innerHTML = rows.map(r => {
      let badgeHtml = `<span class="status-badge status-none">⭕ 미도착</span>`;
      if (r.status) badgeHtml = `<span class="status-badge status-cancel">⛔ ${r.status}</span>`;
      else if (r.arrived) badgeHtml = `<span class="status-badge status-arrived">✅ 도착</span>`;

      return `
        <div class="roster-card ${r.status ? 'canceled' : ''}" id="card-${r.rowNumber}">
          <div class="roster-header">
            <div><span class="user-name">${escapeHtml(r.name)}</span></div>
            ${badgeHtml}
          </div>
          <div>📱 연락처: <a href="tel:${r.phone.replace(/[^\d]/g, '')}" class="phone-link">${escapeHtml(r.phone)}</a></div>
          <div class="grid-action">
            <div>
              <label>도착확인</label>
              <input type="checkbox" ${r.arrived ? 'checked' : ''} ${r.status ? 'disabled' : ''} onchange="updateArrived(${r.rowNumber}, this.checked)" />
            </div>
            <div>
              <label>상태변경</label>
              <select onchange="updateStatus(${r.rowNumber}, this.value)">
                <option value="" ${!r.status ? 'selected' : ''}>선택 없음</option>
                <option value="교육취소" ${r.status === '교육취소' ? 'selected' : ''}>교육취소</option>
                <option value="개별이동" ${r.status === '개별이동' ? 'selected' : ''}>개별이동</option>
              </select>
            </div>
            <div>
              <label>비고(메모)</label>
              <textarea style="padding:4px; height:24px; resize:none;" oninput="updateMemo(${r.rowNumber}, this.value)">${escapeHtml(r.memo || '')}</textarea>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function updateArrived(rowNumber, isChecked) {
    setCardLock(rowNumber, true);
    requestToServer({ action: 'setArrived', rowNumber: rowNumber, arrived: isChecked }, () => {
      const target = ROSTER_DATA.find(x => x.rowNumber === rowNumber);
      if(target) target.arrived = isChecked;
      setCardLock(rowNumber, false);
      renderRoster();
    });
  }

  function updateStatus(rowNumber, value) {
    setCardLock(rowNumber, true);
    requestToServer({ action: 'setStatus', rowNumber: rowNumber, status: value }, () => {
      const target = ROSTER_DATA.find(x => x.rowNumber === rowNumber);
      if(target) {
        target.status = value;
        if(value) target.arrived = false;
      }
      setCardLock(rowNumber, false);
      renderRoster();
    });
  }

  function updateMemo(rowNumber, value) {
    const target = ROSTER_DATA.find(x => x.rowNumber === rowNumber);
    if(target) target.memo = value;

    if(memoTimers[rowNumber]) clearTimeout(memoTimers[rowNumber]);
    memoTimers[rowNumber] = setTimeout(() => {
      requestToServer({ action: 'saveMemo', rowNumber: rowNumber, memo: value });
    }, 600);
  }

  function setCardLock(rowNumber, isLock) {
    const card = document.getElementById(`card-${rowNumber}`);
    if(!card) return;
    if(isLock) card.classList.add("disabled-mask");
    else card.classList.remove("disabled-mask");
  }

  function filterTab(tabType) {
    CURRENT_TAB = tabType;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tabType}`).classList.add('active');
    renderRoster();
  }

  function openAppendModal() {
    document.getElementById("appendPasteInput").value = "";
    document.getElementById("appendModal").classList.add("active");
  }
  function closeAppendModal() { document.getElementById("appendModal").classList.remove("active"); }

  function submitAppendRoster() {
    const rawText = document.getElementById("appendPasteInput").value.trim();
    if(!rawText) return alert("추가할 인원 데이터를 입력하세요.");

    const lines = rawText.split("\n");
    const parsedList = [];
    lines.forEach(line => {
      if(!line.trim()) return;
      const tokens = line.split(/\t|,/);
      let name = tokens[0] ? tokens[0].trim() : "";
      let phone = tokens[1] ? tokens[1].trim() : "";
      if(name) parsedList.push({ name: name, phone: phone || "전화번호 없음" });
    });

    if(parsedList.length === 0) return alert("형식이 맞지 않습니다.");

    document.getElementById("appendModal").classList.remove("active");
    document.getElementById("loading-msg").style.display = "block";
    document.getElementById("roster-list").style.display = "none";

    requestToServer({ action: 'appendRoster', newRowsJson: JSON.stringify(parsedList) }, (addedCount) => {
      alert(`새로운 ${addedCount}명의 데이터가 데이터 서버(구글 시트)에 안전하게 이어 붙었습니다!`);
      fetchRoster();
    });
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
